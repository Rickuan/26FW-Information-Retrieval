[corpus]
source_warc = "dataset/04.warc"            # 由使用者自行放入（README 說明）
injected_warc = "dataset/04_injected.warc"

[llm]
model = "qwen3:8b"
temperature = 0
num_ctx = 8192           # 已實測 qwen3:8b + 8192 可以完整放進 GPU
disable_thinking = true

[embed]
model = "embeddinggemma"
query_prefix = "task: search result | query: "   # model card 的檢索用 query 格式
doc_prefix = "title: none | text: "              # 沒有標題時固定寫 none
dim = 768
batch_size = 64

[retrieval]
k_each = 20              # 詞彙、語意兩路各取幾篇
k_final = 5              # 合併後送進 LLM 的篇數
rrf_k = 60
# hybrid 只過濾「只出現在語意那一路、且語意分數（cosine）低於此值」的文件；兩路都有的文件不受影響。
# 這個值依目前的 embedding 模型與前綴定出（A5 V2），更換 embedding 設定時要重新評估。
semantic_min_score = 0.30
passage_words = 300
passage_stride = 250     # 相鄰 passage 重疊 50 字
prompt_passage_max_words = 300

[paths]
index_dir = "index"
docstore = "store/docstore.sqlite"
vectorstore_dir = "store/vectorstore"
embed_ckpt_dir = "store/embed_ckpt"
build_meta = "store/build_meta.json"
fixtures_dir = "fixtures"
output_dir = "output"

# 每位成員一組：學號、句子與 target_trec_ids 由每位成員自行挑選並填入；
# 以 tools/inject_warc.py 依這份設定產生 04_injected.warc
[[inject.tokens]]
student_id = "115598067"
sentence = "The IR HW3 verification code 115598067 is registered by team member A."
target_trec_ids = ["clueweb09-en0000-04-00019", "clueweb09-en0000-04-15079", "clueweb09-en0000-04-30250"]   # 固定 3 篇

[[inject.tokens]]
student_id = "115598022"
sentence = "The IR HW3 verification code 115598022 is registered by team member B."
target_trec_ids = ["clueweb09-en0000-04-00018", "clueweb09-en0000-04-15051", "clueweb09-en0000-04-30233"]
